<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Weekly Project</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Todo List</h1>
    <div id="todo-container">
      <form class="todo-form">
        <input
          class="todo-input"
          type="text"
          autofocus
          placeholder="Title..."
        />
        <input type="submit" value="Add" />
      </form>
      <ul class="todos-list"></ul>
    </div>
    <script type="module" src="./dist/index.js"></script>
  </body>
</html>
